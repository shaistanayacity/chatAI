<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; color: #222; }
  #chat-toggle {
    position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px;
    border: 0; border-radius: 50%; background: #2563eb; color: #fff;
    font-size: 24px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  #chat-box {
    position: fixed; right: 20px; bottom: 90px; width: 340px; max-width: calc(100vw - 40px);
    height: 460px; max-height: calc(100vh - 120px); display: none; flex-direction: column;
    background: #fff; border: 1px solid #ddd; border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  #chat-box.open { display: flex; }
  #chat-header { background: #2563eb; color: #fff; padding: 12px 16px; font-weight: 600; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #f8fafc; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg.bot { align-self: flex-start; background: #e5e7eb; color: #111; }
  #chat-form { display: flex; border-top: 1px solid #ddd; }
  #chat-input { flex: 1; border: 0; padding: 12px; font-size: 14px; outline: none; }
  #chat-send { border: 0; background: #2563eb; color: #fff; padding: 0 16px; cursor: pointer; }
  #chat-send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<h1>Website Kamu</h1>
<p>Konten website di sini. Widget chat ada di pojok kanan bawah.</p>

<button id="chat-toggle" aria-label="Buka chat">💬</button>
<div id="chat-box" role="dialog" aria-label="Chat">
  <div id="chat-header">Tanya Kami</div>
  <div id="chat-messages"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" maxlength="2000" placeholder="Ketik pesan..." autocomplete="off">
    <button id="chat-send" type="submit">Kirim</button>
  </form>
</div>

<script>
  const API_URL = "/api/chat";
  const box = document.getElementById("chat-box");
  const list = document.getElementById("chat-messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const send = document.getElementById("chat-send");
  const history = [];

  document.getElementById("chat-toggle").onclick = () => {
    box.classList.toggle("open");
    if (box.classList.contains("open")) {
      if (!list.children.length) add("bot", "Halo! Ada yang bisa kami bantu?");
      input.focus();
    }
  };

  function add(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text; // textContent: aman dari XSS
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("user", text);
    history.push({ role: "user", content: text });
    send.disabled = true;
    const typing = add("bot", "...");
    try {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Error");
      typing.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      typing.textContent = err.message || "Maaf, terjadi kesalahan.";
      history.pop(); // buang pesan user yang gagal agar riwayat tetap valid
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
